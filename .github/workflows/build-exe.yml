name: Build Windows EXE und Mac-App (Apple Silicon)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Versionsnummer und Versionsressource
        id: ver
        shell: bash
        run: python build/make_version_info.py >> "$GITHUB_OUTPUT"

      - name: EXE bauen (PyInstaller, Desktop-Fenster ohne Konsole)
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name RealSense-Viewer-MK2
          --icon assets/icon.ico
          --version-file build/version_info.txt
          --add-data "assets;assets"
          --collect-all pyrealsense2
          --collect-submodules OpenGL
          --hidden-import pyqtgraph.opengl
          --hidden-import demoraum
          --exclude-module tkinter
          --exclude-module pkg_resources
          --exclude-module pyqtgraph.examples
          --exclude-module PySide6.QtWebEngineCore
          --exclude-module PySide6.QtWebEngineWidgets
          --exclude-module PySide6.Qt3DCore
          --exclude-module PySide6.QtQuick
          --exclude-module PySide6.QtQml
          --exclude-module PySide6.QtMultimedia
          app.py

      - name: Selbsttest der EXE
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\RealSense-Viewer-MK2.exe" -ArgumentList "--selbsttest" -Wait -PassThru
          if (Test-Path "dist\selbsttest.txt") { Get-Content "dist\selbsttest.txt" }
          if ($p.ExitCode -ne 0) { Write-Error "Selbsttest fehlgeschlagen (Exit $($p.ExitCode))"; exit 1 }
          Remove-Item "dist\selbsttest.txt", "dist\config.ini", "dist\realsense-viewer.log" -ErrorAction SilentlyContinue

      - name: Paket schnüren
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $dir = "release/RealSense-Viewer-MK2_v$v"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item dist/RealSense-Viewer-MK2.exe $dir/
          Copy-Item README.md $dir/
          Copy-Item CHANGELOG.md $dir/
          Compress-Archive -Path "$dir/*" -DestinationPath "release/RealSense-Viewer-MK2_v${v}_Windows.zip" -Force

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: RealSense-Viewer-MK2_v${{ steps.ver.outputs.version }}_Windows
          path: release/RealSense-Viewer-MK2_v${{ steps.ver.outputs.version }}/

      - name: GitHub-Release (nur bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: RealSense-Viewer-MK2 v${{ steps.ver.outputs.version }}
          files: release/*.zip

  mac:
    # macos-14 = Apple Silicon (arm64)
    runs-on: macos-14
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Python 3.11 einrichten (arm64)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python -c "import platform, pyrealsense2; print(platform.machine(), 'pyrealsense2 ok')"

      - name: Versionsnummer
        id: ver
        run: python build/make_version_info.py >> "$GITHUB_OUTPUT"

      - name: App-Symbol (icns) erzeugen
        run: |
          mkdir -p build/icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon.png --out build/icon.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2))
            sips -z $d $d assets/icon.png --out build/icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns build/icon.iconset -o build/icon.icns

      - name: Mac-App bauen (PyInstaller, arm64)
        run: >
          pyinstaller --noconfirm --clean --windowed --onedir
          --target-arch arm64
          --name RealSense-Viewer-MK2
          --icon build/icon.icns
          --osx-bundle-identifier local.realsenseviewer.mk2
          --add-data "assets:assets"
          --collect-all pyrealsense2
          --collect-submodules OpenGL
          --hidden-import pyqtgraph.opengl
          --hidden-import demoraum
          --exclude-module tkinter
          --exclude-module pkg_resources
          --exclude-module pyqtgraph.examples
          --exclude-module PySide6.QtWebEngineCore
          --exclude-module PySide6.QtWebEngineWidgets
          --exclude-module PySide6.Qt3DCore
          --exclude-module PySide6.QtQuick
          --exclude-module PySide6.QtQml
          --exclude-module PySide6.QtMultimedia
          app.py

      - name: Versionsnummer ins App-Paket, neu signieren (ad hoc)
        run: |
          V="${{ steps.ver.outputs.version }}"
          P="dist/RealSense-Viewer-MK2.app/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "$V" "$P"
          plutil -replace CFBundleVersion -string "$V" "$P"
          plutil -replace NSHighResolutionCapable -bool true "$P"
          plutil -replace LSMinimumSystemVersion -string "12.0" "$P"
          codesign --force --deep --sign - dist/RealSense-Viewer-MK2.app
          codesign --verify --deep dist/RealSense-Viewer-MK2.app
          file dist/RealSense-Viewer-MK2.app/Contents/MacOS/RealSense-Viewer-MK2

      - name: Selbsttest der App
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          D="$HOME/Library/Application Support/RealSense-Viewer-MK2"
          set +e
          dist/RealSense-Viewer-MK2.app/Contents/MacOS/RealSense-Viewer-MK2 --selbsttest
          rc=$?
          set -e
          cat "$D/selbsttest.txt" || true
          rm -f "$D/selbsttest.txt" "$D/config.ini" "$D/realsense-viewer.log"
          exit $rc

      - name: Paket schnüren
        run: |
          V="${{ steps.ver.outputs.version }}"
          DIR="release/RealSense-Viewer-MK2_v${V}_Mac"
          mkdir -p "$DIR"
          ditto dist/RealSense-Viewer-MK2.app "$DIR/RealSense-Viewer-MK2.app"
          cp README.md CHANGELOG.md "$DIR/"
          ditto -c -k --keepParent "$DIR" "release/RealSense-Viewer-MK2_v${V}_Mac-AppleSilicon.zip"

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: RealSense-Viewer-MK2_v${{ steps.ver.outputs.version }}_Mac-AppleSilicon
          path: release/RealSense-Viewer-MK2_v${{ steps.ver.outputs.version }}_Mac-AppleSilicon.zip

      - name: GitHub-Release (nur bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: RealSense-Viewer-MK2 v${{ steps.ver.outputs.version }}
          files: release/*.zip
